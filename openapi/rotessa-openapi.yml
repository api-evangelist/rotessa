components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        API key placed in the Authorization header in the form
        `Authorization: Token token="<your_api_key>"`. Keys are created and revoked
        in the Rotessa admin portal.
  responses:
    BadRequest:
      description: Bad Request - your request includes invalid parameters.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Unauthorized - your API key is not valid or is missing.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Not Found - the specified resource could not be found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotAcceptable:
      description: Not Acceptable - you requested a format that isn't json.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UnprocessableEntity:
      description: Unprocessable Entity - your request results in invalid data.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InternalServerError:
      description: Internal Server Error - we had a problem with our server. Try again later.
  schemas:
    Address:
      type: object
      description: Customer address.
      properties:
        address_1: { type: string }
        address_2: { type: string }
        city: { type: string }
        province_code: { type: string, description: Province/state code }
        postal_code: { type: string }
        country: { type: string }
    Customer:
      type: object
      properties:
        id: { type: integer, description: ID of the customer }
        uuid: { type: string, description: UUID of the customer }
        custom_identifier: { type: string, description: Your own unique customer identifier }
        name: { type: string, description: Full name of customer }
        email: { type: string, description: Customer email address }
        customer_type: { type: string, enum: [Personal, Business] }
        home_phone: { type: string }
        phone: { type: string }
        bank_name: { type: string }
        institution_number: { type: string, description: Bank institution number for Canadian customers }
        transit_number: { type: string, description: Bank transit number for Canadian customers }
        bank_account_type: { type: string, enum: [Savings, Checking], description: For American customers }
        authorization_type: { type: string, enum: ['In Person', 'Online'] }
        routing_number: { type: string, description: Bank routing number for American customers }
        account_number: { type: string, description: Bank account number }
        address: { $ref: '#/components/schemas/Address' }
        transaction_schedules:
          type: array
          items: { $ref: '#/components/schemas/TransactionSchedule' }
        financial_transactions:
          type: array
          items: { $ref: '#/components/schemas/FinancialTransaction' }
    CustomerCreate:
      type: object
      required: [name, account_number]
      properties:
        name: { type: string, description: Full name of customer }
        custom_identifier: { type: string, description: Your own customer identifier. Must be unique. }
        email: { type: string }
        home_phone: { type: string }
        phone: { type: string }
        bank_name: { type: string }
        institution_number: { type: string, description: Bank institution number for Canadian customers }
        transit_number: { type: string, description: Bank transit number for Canadian customers }
        bank_account_type: { type: string, enum: [Savings, Checking], description: For American customers }
        authorization_type: { type: string, enum: ['In Person', 'Online'] }
        routing_number: { type: string, description: Routing number for American customers }
        account_number: { type: string, description: Bank account number }
        address: { $ref: '#/components/schemas/Address' }
        customer_type: { type: string, enum: [Personal, Business] }
    CustomerUpdate:
      allOf:
        - type: object
          properties:
            id: { type: integer, description: The ID of the customer to update }
        - $ref: '#/components/schemas/CustomerCreate'
    TransactionSchedule:
      type: object
      properties:
        id: { type: integer, description: ID of the transaction schedule }
        uuid: { type: string, description: UUID of the transaction schedule }
        amount: { type: number, description: Amount for schedule }
        process_date: { type: string, description: The initial date to begin withdrawing funds }
        frequency: { $ref: '#/components/schemas/Frequency' }
        installments: { type: integer, description: The number of installments. Leave blank to continue indefinitely. }
        comment: { type: string, description: A place to enter notes for the transaction schedule }
        next_process_date: { type: string, description: The next date that funds will be withdrawn }
        financial_transactions:
          type: array
          items: { $ref: '#/components/schemas/FinancialTransaction' }
    TransactionScheduleCreate:
      type: object
      required: [customer_id, amount, process_date, frequency]
      properties:
        customer_id: { type: integer, description: ID of customer }
        amount: { type: number, description: Amount for schedule }
        process_date: { type: string, description: The initial date to begin withdrawing funds (e.g. November 20, 2016) }
        frequency: { $ref: '#/components/schemas/Frequency' }
        installments: { type: integer, description: The number of installments. If excluded, schedule is indefinite. }
        comment: { type: string, description: Optional comment for schedule }
    TransactionScheduleCreateWithCustomIdentifier:
      type: object
      required: [custom_identifier, amount, process_date, frequency]
      properties:
        custom_identifier: { type: string, description: Your own unique custom identifier for the customer }
        amount: { type: number, description: Amount for schedule }
        process_date: { type: string, description: The initial date to begin withdrawing funds }
        frequency: { $ref: '#/components/schemas/Frequency' }
        installments: { type: integer, description: The number of installments. If excluded, schedule is indefinite. }
        comment: { type: string, description: Optional comment for schedule }
    TransactionScheduleUpdate:
      type: object
      required: [id]
      properties:
        id: { type: integer, description: The ID of the transaction schedule to update }
        amount: { type: number, description: Amount for the schedule }
        comment: { type: string, description: Optional comment for schedule }
    Frequency:
      type: string
      description: Frequency of the transaction schedule.
      enum:
        - Once
        - Weekly
        - Every Other Week
        - Monthly
        - Every Other Month
        - Quarterly
        - Semi-Annually
        - Yearly
    FinancialTransaction:
      type: object
      properties:
        id: { type: integer, description: ID of the financial transaction }
        uuid: { type: string, description: UUID of the financial transaction }
        amount: { type: number, description: Transaction amount }
        process_date: { type: string, description: The scheduled process date of the transaction }
        status:
          type: string
          description: The current status of the transaction.
          enum: [Future, Pending, Approved, Declined, Chargeback]
        status_reason:
          type: string
          description: The reason for the Declined or Chargeback status of a transaction.
        transaction_schedule_id: { type: integer, description: ID of the transaction schedule that created this transaction }
        bank_name: { type: string }
        institution_number: { type: string }
        transit_number: { type: string }
        account_number: { type: string }
    ErrorEnvelope:
      type: object
      description: >-
        Rotessa error envelope. Errors are returned as a list of objects each carrying
        a machine-readable error_code and a human-readable error_message.
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              error_code: { type: string, example: installments_required }
              error_message: { type: string, example: Installments value must be at least 1. }
