note: >-
  Rotessa does not use RFC 9457 problem+json. Errors are returned as a list under an
  `errors` key, each carrying a machine-readable `error_code` and human `error_message`.
  HTTP response codes are derived from the docs "HTTP RESPONSE CODES" table; example
  error_codes are the ones published verbatim in the docs.
