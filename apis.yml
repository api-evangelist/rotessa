name: Rotessa
kind: company
description: >-
  Rotessa is a Winnipeg, Manitoba-based fintech that helps small and mid-sized
  North American businesses collect recurring payments directly from their
  customers' bank accounts. In Canada it moves money over the pre-authorized
  debit (PAD) rails and in the United States over ACH, positioning itself as a
  low-cost, bank-account-native alternative to card processing for invoices,
  memberships, subscriptions, tuition, and rent. Rotessa exposes a genuine
  public REST API (https://api.rotessa.com/v1) that lets platforms and businesses
  programmatically create customers, verify bank details (including via the
  Flinks aggregator), and schedule one-time or recurring transactions, backed by
  a free sandbox (sandbox.rotessa.com) and API-key authentication. As an
  API-native SMB money-movement fintech, it sits in the thin-but-real
  account-to-account layer of Canada's payments market, alongside peers like
  VoPay, Plooto, and Helcim, operating through bank rails and aggregators rather
  than any live open-banking payment mandate.
